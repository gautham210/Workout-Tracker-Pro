name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (logic + behavioural)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  mobile:
    name: Mobile (typecheck, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      - run: npm ci

      # mobile/ has its own dependency tree. The root install does not provide
      # Expo's tsconfig base or the React Native type declarations.
      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      # Mobile was excluded from ESLint entirely until now, so Rules of Hooks violations in the
      # active-workout flow were undetectable. `npm run lint` from the repo root covers mobile/.
      - name: TypeScript (Expo app)
        run: npm run typecheck:mobile

      - name: Lint (includes mobile/)
        run: npm run lint

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Production dependency tree only. Dev-tooling advisories are tracked separately.
      - name: Production vulnerabilities must be zero
        run: npm audit --omit=dev --audit-level=low

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
